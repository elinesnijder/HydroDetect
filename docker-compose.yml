services:
  db:
    image: mysql:8.0
    container_name: hydrodetect-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hydrodetect
      MYSQL_USER: hydro
      MYSQL_PASSWORD: hydro123
    ports:
      - "3306:3306"
    volumes:
      - hydrodetect_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hydrodetect-phpmyadmin
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hydrodetect-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: hydrodetect
      DB_USER: hydro
      DB_PASSWORD: hydro123
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  hydrodetect_db_data: